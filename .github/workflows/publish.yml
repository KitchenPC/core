name: Publish NuGet

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  publish:
    name: Publish KitchenPC packages
    runs-on: ubuntu-latest
    environment: nuget

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read version from tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' is not a valid version tag such as v1.0.0." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore src/core.slnx

      - name: Build
        run: dotnet build src/core.slnx --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test src/UnitTests/UnitTests.csproj
          --configuration Release
          --no-build
          --no-restore

      - name: Pack Core
        run: >-
          dotnet pack src/Core/Core.csproj
          --configuration Release
          --no-build
          --output artifacts
          -p:Version=${{ steps.version.outputs.value }}

      - name: Pack DB
        run: >-
          dotnet pack src/DB/DB.csproj
          --configuration Release
          --no-build
          --output artifacts
          -p:Version=${{ steps.version.outputs.value }}

      - name: Pack ASP.NET Core integration
        run: >-
          dotnet pack src/Core.AspNetCore/Core.AspNetCore.csproj
          --configuration Release
          --no-build
          --output artifacts
          -p:Version=${{ steps.version.outputs.value }}

      - name: Upload release packages
        uses: actions/upload-artifact@v7
        with:
          name: KitchenPC-${{ steps.version.outputs.value }}
          path: artifacts/*
          if-no-files-found: error

      - name: Sign in to NuGet
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish Core to NuGet
        run: >-
          dotnet nuget push
          artifacts/KitchenPC.Core.${{ steps.version.outputs.value }}.nupkg
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Publish DB to NuGet
        run: >-
          dotnet nuget push
          artifacts/KitchenPC.DB.${{ steps.version.outputs.value }}.nupkg
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Publish ASP.NET Core integration to NuGet
        run: >-
          dotnet nuget push
          artifacts/KitchenPC.Core.AspNetCore.${{ steps.version.outputs.value }}.nupkg
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
